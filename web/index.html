<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>WaveTrack</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <div id="signin" class="solo" hidden>
    <section class="card panel">
      <div class="mark"><svg class="icon"><use href="/assets/icons.svg#logo"/></svg></div>
      <h1>Sign in to WaveTrack</h1>
      <p>Paste the admin access token WaveTrack printed when it first started.</p>
      <form id="signin-form">
        <div class="field">
          <label for="token">Access token</label>
          <input class="input mono" id="token" name="token" autocomplete="current-password" placeholder="wt_…" required>
        </div>
        <p class="error" id="signin-error" hidden></p>
        <button class="button primary" type="submit">Sign in</button>
      </form>
      <p class="note">Lost it? Run <span class="mono">wavetrack token reset</span> on the WaveTrack machine.</p>
    </section>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <a class="brand" href="#/now"><svg class="icon"><use href="/assets/icons.svg#logo"/></svg><span class="brand-name">WaveTrack</span></a>
      <nav class="nav" aria-label="Sections">
        <a href="#/now"><svg class="icon"><use href="/assets/icons.svg#now"/></svg><span>Now</span></a>
        <a href="#/timeline"><svg class="icon"><use href="/assets/icons.svg#timeline"/></svg><span>Timeline</span></a>
        <a href="#/history"><svg class="icon"><use href="/assets/icons.svg#history"/></svg><span>History</span></a>
        <a href="#/people"><svg class="icon"><use href="/assets/icons.svg#people"/></svg><span>People</span></a>
        <a href="#/nearby"><svg class="icon"><use href="/assets/icons.svg#nearby"/></svg><span>Nearby</span></a>
        <a href="#/audit"><svg class="icon"><use href="/assets/icons.svg#shield"/></svg><span>Audit</span></a>
      </nav>
      <div class="topbar-end">
        <label class="theme-picker"><span class="sr-only">Theme</span>
          <select id="theme">
            <option value="">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="classic">Classic</option>
            <option value="code">Code</option>
            <option value="contrast">High contrast</option>
          </select>
        </label>
        <button class="icon-button" id="signout" type="button" aria-label="Sign out" title="Sign out"><svg class="icon"><use href="/assets/icons.svg#logout"/></svg></button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
    <footer class="statusbar" aria-label="Status">
      <span class="sb-item" id="sb-capture"><span class="pulse"></span><span class="label">Connecting…</span></span>
      <span class="sb-item" id="sb-presence"></span>
      <span class="sb-spacer"></span>
      <span class="sb-item sb-optional" id="sb-updated"></span>
      <span class="sb-item sb-optional" id="sb-version"></span>
    </footer>
  </div>

  <dialog id="dialog"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
