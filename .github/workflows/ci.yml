name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: JavaScript syntax
        run: node --check web/assets/app.js && node --check web/assets/join.js

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libpcap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

  smoke:
    name: End-to-end demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Build
        run: go build -o wavetrack ./cmd/wavetrack
      - name: Run the demo and sign in
        run: |
          ./wavetrack serve --demo --listen 127.0.0.1:8099 2> demo.log &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8099/healthz && break; sleep 1; done
          token=$(grep -o 'wt_[a-z0-9]*' demo.log | head -1)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/now)" = 401
          curl -sf -c jar -H 'Content-Type: application/json' -d "{\"token\":\"$token\"}" http://127.0.0.1:8099/api/login
          curl -sf -b jar http://127.0.0.1:8099/api/now | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["people"]) == 12, d; print(sum(p["present"] for p in d["people"]), "of 12 in")'
          curl -sf -b jar 'http://127.0.0.1:8099/api/history?days=7' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["dates"]) == 7'
