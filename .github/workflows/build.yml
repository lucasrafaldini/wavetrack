name: build
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Download dependencies
        run: go mod download

      - name: Build main application
        run: go build -o wavetrack ./cmd/wavetrack

      - name: Build seed_history tool
        run: go build -o seed_history ./cmd/seed_history

      - name: Run tests
        run: go test ./...

      - name: Run linter
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run || true
